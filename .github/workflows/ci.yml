name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore RedisGuiManager.sln

      - name: Build
        run: dotnet build RedisGuiManager.sln --configuration Release --no-restore

      # Logic and safety-critical behaviour (read-only gate, cursor paging, config persistence).
      - name: Unit tests
        run: dotnet test tests/RedisGuiManager.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=unit-tests.trx" --results-directory artifacts/test-results

      # Smoke tests that need a real WinForms message loop (STA + form layout).
      - name: Regression smoke checks
        run: dotnet run --project checks/RegressionChecks.csproj --configuration Release --no-build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: ignore

      - name: Verify the self-contained publish script
        shell: pwsh
        run: ./scripts/publish.ps1 -Configuration Release -Runtime win-x64 -OutputPath artifacts/publish-smoke -SkipArchive

      - name: Upload publish smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-smoke
          path: artifacts/publish-smoke
          if-no-files-found: ignore